<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Livegang HH Shops</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
		>

		<style id="stijl">
		:root {
			--grond: #f5f7f3;
			--vlak: #ffffff;
			--vlak-2: #eaeee5;
			--inkt: #1a1d17;
			--gedempt: #5f6659;
			--lijn: #dde2d6;
			--lijn-sterk: #c0cab5;
			--accent: #1f5e3d;
			--accent-zacht: #e4efe6;
			--accent-rand: #a9ccb6;
			--wacht: #8a6516;
			--wacht-zacht: #f7eeda;
			--kritiek: #9c3a26;
			--schaduw: 0 1px 2px rgba(26, 29, 23, 0.05);
			color-scheme: light;
		}

		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--grond: #111410;
				--vlak: #191d17;
				--vlak-2: #232820;
				--inkt: #e9ece3;
				--gedempt: #98a291;
				--lijn: #2b3128;
				--lijn-sterk: #414a3d;
				--accent: #79c895;
				--accent-zacht: #1b2a20;
				--accent-rand: #2f5540;
				--wacht: #dcb168;
				--wacht-zacht: #2a2213;
				--kritiek: #e69077;
				--schaduw: 0 1px 2px rgba(0, 0, 0, 0.35);
				color-scheme: dark;
			}
		}

		:root[data-theme="dark"] {
			--grond: #111410;
			--vlak: #191d17;
			--vlak-2: #232820;
			--inkt: #e9ece3;
			--gedempt: #98a291;
			--lijn: #2b3128;
			--lijn-sterk: #414a3d;
			--accent: #79c895;
			--accent-zacht: #1b2a20;
			--accent-rand: #2f5540;
			--wacht: #dcb168;
			--wacht-zacht: #2a2213;
			--kritiek: #e69077;
			--schaduw: 0 1px 2px rgba(0, 0, 0, 0.35);
			color-scheme: dark;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--grond);
			color: var(--inkt);
			font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
			font-size: 16px;
			line-height: 1.55;
			-webkit-font-smoothing: antialiased;
		}

		.omslag {
			max-width: 60rem;
			margin: 0 auto;
			padding-inline: 20px;
			padding-block: 0 72px;
		}

		.merkregel {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 0;
			font-family: "IBM Plex Mono", ui-monospace, monospace;
			font-size: 12px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: var(--gedempt);
		}
		.merkregel::before {
			content: "";
			width: 26px;
			height: 2px;
			background: var(--accent);
		}

		.kop {
			padding-block: 56px 0;
		}

		h1 {
			font-family: Archivo, system-ui, sans-serif;
			font-weight: 700;
			font-size: clamp(2.1rem, 5.2vw, 3rem);
			line-height: 1.05;
			letter-spacing: -0.02em;
			text-wrap: balance;
			margin: 18px 0 0;
		}

		.inleiding {
			max-width: 58ch;
			margin: 16px 0 0;
			color: var(--gedempt);
			font-size: 1.05rem;
		}
		.inleiding strong {
			color: var(--inkt);
			font-weight: 600;
		}

		.voortgang {
			margin-top: 32px;
			border: 1px solid var(--lijn);
			background: var(--vlak);
			border-radius: 10px;
			padding: 18px 20px;
			box-shadow: var(--schaduw);
		}
		.voortgang-kop {
			display: flex;
			flex-wrap: wrap;
			align-items: baseline;
			justify-content: space-between;
			gap: 6px 16px;
		}
		.voortgang-label {
			margin: 0;
			font-family: "IBM Plex Mono", monospace;
			font-size: 12px;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--gedempt);
		}
		.voortgang-getal {
			margin: 0;
			font-family: Archivo, sans-serif;
			font-weight: 700;
			font-size: 1.45rem;
			font-variant-numeric: tabular-nums;
			letter-spacing: -0.01em;
		}
		.voortgang-getal span {
			color: var(--gedempt);
			font-weight: 600;
			font-size: 0.95rem;
		}

		.balk {
			margin-top: 14px;
			height: 6px;
			border-radius: 99px;
			background: var(--vlak-2);
			overflow: hidden;
		}
		.balk div {
			height: 100%;
			background: var(--accent);
			border-radius: 99px;
			transition: width 0.35s ease;
		}

		.melding {
			margin: 14px 0 0;
			padding: 10px 14px;
			border-radius: 8px;
			background: var(--wacht-zacht);
			border: 1px solid var(--lijn);
			font-size: 0.9rem;
		}

		.fase {
			margin-top: 48px;
		}
		.fase-kop {
			display: flex;
			align-items: flex-start;
			gap: 14px;
			padding-bottom: 14px;
			border-bottom: 2px solid var(--inkt);
		}
		.fase-nr {
			font-family: "IBM Plex Mono", monospace;
			font-weight: 500;
			font-size: 13px;
			color: var(--accent);
			padding-top: 7px;
			white-space: nowrap;
			font-variant-numeric: tabular-nums;
		}
		.fase-tekst h2 {
			font-family: Archivo, sans-serif;
			font-weight: 600;
			font-size: 1.4rem;
			letter-spacing: -0.012em;
			margin: 0;
			text-wrap: balance;
		}
		.fase-tekst p {
			margin: 4px 0 0;
			color: var(--gedempt);
			font-size: 0.95rem;
			max-width: 58ch;
		}

		.taak {
			display: grid;
			grid-template-columns: 30px minmax(0, 1fr);
			gap: 0 14px;
			padding: 22px 0;
			border-bottom: 1px solid var(--lijn);
		}
		.taak.af .taak-titel {
			color: var(--gedempt);
			text-decoration: line-through;
			text-decoration-thickness: 1px;
		}
		.taak.af .taak-hoe,
		.taak.af .waarom {
			opacity: 0.5;
		}

		.vink {
			grid-row: 1 / span 3;
			appearance: none;
			-webkit-appearance: none;
			width: 22px;
			height: 22px;
			margin: 3px 0 0;
			border: 1.5px solid var(--lijn-sterk);
			border-radius: 6px;
			background: var(--vlak);
			cursor: pointer;
			display: grid;
			place-content: center;
			transition:
				background 0.15s ease,
				border-color 0.15s ease;
		}
		.vink::after {
			content: "";
			width: 11px;
			height: 6px;
			border-left: 2px solid var(--vlak);
			border-bottom: 2px solid var(--vlak);
			transform: rotate(-45deg) translate(1px, -2px);
			opacity: 0;
		}
		.vink:checked {
			background: var(--accent);
			border-color: var(--accent);
		}
		.vink:checked::after {
			opacity: 1;
		}
		.vink:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}
		.vink:disabled {
			cursor: default;
			opacity: 0.45;
		}

		.taak-regel {
			display: flex;
			flex-wrap: wrap;
			align-items: baseline;
			gap: 6px 10px;
		}
		.taak-titel {
			font-weight: 600;
			font-size: 1.05rem;
			letter-spacing: -0.005em;
			margin: 0;
			cursor: pointer;
		}

		.wie {
			font-family: "IBM Plex Mono", monospace;
			font-size: 11px;
			font-weight: 500;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			padding: 3px 8px;
			border-radius: 5px;
			border: 1px solid var(--lijn-sterk);
			color: var(--gedempt);
			white-space: nowrap;
		}
		.wie[data-wie="jij"] {
			color: var(--accent);
			border-color: var(--accent-rand);
			background: var(--accent-zacht);
		}
		.wie[data-wie="collega"] {
			color: var(--wacht);
			border-color: var(--wacht);
			background: var(--wacht-zacht);
		}

		.blokkeert {
			font-size: 12px;
			color: var(--kritiek);
			font-weight: 500;
		}

		.taak-hoe {
			margin-top: 10px;
		}
		.taak-hoe ol {
			margin: 0;
			padding-left: 1.25em;
		}
		.taak-hoe li {
			margin: 0 0 5px;
			font-size: 0.95rem;
			max-width: 66ch;
		}
		.taak-hoe li:last-child {
			margin-bottom: 0;
		}
		.taak-na {
			margin: 10px 0 0;
			font-size: 0.93rem;
			color: var(--gedempt);
			max-width: 66ch;
		}

		code {
			font-family: "IBM Plex Mono", ui-monospace, monospace;
			font-size: 0.87em;
			background: var(--vlak-2);
			border: 1px solid var(--lijn);
			border-radius: 4px;
			padding: 1px 5px;
			overflow-wrap: break-word;
		}

		pre {
			font-family: "IBM Plex Mono", ui-monospace, monospace;
			font-size: 0.82rem;
			line-height: 1.6;
			background: var(--vlak);
			border: 1px solid var(--lijn);
			border-left: 3px solid var(--accent-rand);
			border-radius: 6px;
			padding: 12px 14px;
			margin: 10px 0 0;
			overflow-x: auto;
		}
		pre code {
			background: none;
			border: 0;
			padding: 0;
			font-size: 1em;
		}

		.waarom {
			margin: 12px 0 0;
			padding-left: 12px;
			border-left: 2px solid var(--lijn-sterk);
			font-size: 0.9rem;
			color: var(--gedempt);
			max-width: 64ch;
		}

		.slot {
			margin-top: 56px;
		}
		.slot h2 {
			font-family: Archivo, sans-serif;
			font-weight: 600;
			font-size: 1.2rem;
			margin: 0 0 14px;
		}
		.slot ul {
			margin: 0;
			padding-left: 1.1em;
			color: var(--gedempt);
		}
		.slot li {
			margin-bottom: 8px;
			font-size: 0.95rem;
			max-width: 66ch;
		}
		.slot strong {
			color: var(--inkt);
			font-weight: 600;
		}

		.voet {
			margin-top: 52px;
			padding-top: 20px;
			border-top: 1px solid var(--lijn);
			font-family: "IBM Plex Mono", monospace;
			font-size: 12px;
			color: var(--gedempt);
			display: flex;
			flex-wrap: wrap;
			gap: 6px 18px;
			justify-content: space-between;
		}

		@media (max-width: 540px) {
			.kop {
				padding-block: 36px 0;
			}
			.taak {
				grid-template-columns: 26px minmax(0, 1fr);
				gap: 0 11px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			* {
				transition: none !important;
				animation: none !important;
			}
		}
		</style>
	</head>

						{
							id: 'oude-links',

						{
							id: 'inloggen',
							titel: 'Inloggen testen',
							wie: 'jij',
							stappen: [
								'Log in op <code>hh-shops.nl/admin</code> met een bestaand beheerdersaccount.',
								'En op <code>hh-shops.nl/account</code> met een klantaccount.',
							],
						},
						{
							id: 'proefbestelling',
							titel: 'Een echte bestelling doen en terugbetalen',
							wie: 'jij',
							blokkeert: 'De belangrijkste test van allemaal',
							stappen: [
								'Bestel iets van een paar euro met een echte betaling, op een e-mailadres dat <strong>niet</strong> van de winkel is.',
								'Controleer dat de bestelbevestiging aankomt. Kijk ook even in de spam.',
								'Zet hem in het paneel op verzonden, met een echte track-and-tracecode erbij.',
								'Controleer dat de verzendmail aankomt en dat de volglink werkt.',
								'Betaal terug via het dashboard van Mollie.',
							],
							waarom:
								'Dit is de enige test die het hele pad raakt: Mollie, de database, Resend, de vervoerder en het paneel. Alles wat hiervoor goed leek, kan hier alsnog stuklopen.',
						},

			const NIET_NODIG = [
				"<strong>De verplichte pagina's</strong> (voorwaarden, privacy, klantenservice) worden op de frontend-branch gemaakt. Het vinkje bij afrekenen verwijst er al heen.",
				'<strong>Het herroepingsformulier.</strong> Jullie eigen voorwaarden verplichten je dat op verzoek te geven, artikel 5.3. Een mail met "ik wil retourneren" volstaat zolang het er niet is, maar netter is een formulier.',
				'<strong>Klarna uit de teksten.</strong> Staat nog in de kernpunten en de footer, in <code>src/lib/site.ts</code>. De frontend-agent haalt dat eruit.',
				'<strong>Terugbetalen vanuit het paneel, een factuur-pdf en kortingscodes.</strong> Bewust later. Terugbetalen gaat tot die tijd via het dashboard van Mollie.',
				'<strong>Een cookiebanner is niet nodig.</strong> De nieuwe shop zet alleen functionele cookies, voor de sessie, de winkelmand en de favorieten, en laadt geen enkel extern script. De oude cookieverklaring beschrijft Facebook- en Google-cookies die hier niet meer bestaan.',
			];

			const WIE_TEKST = { jij: 'jij', collega: 'collega', claude: 'claude doet dit' };

			const wortel = document.getElementById('wortel');

			let staat = { af: {} };
			const magSchrijven = true;
			let meldtekst = '';

			const ALLE = FASEN.reduce((op, fase) => op.concat(fase.taken), []);

			function el(soort, klasse, tekst) {
				const knoop = document.createElement(soort);
				if (klasse) knoop.className = klasse;
				if (tekst !== undefined) knoop.textContent = tekst;
				return knoop;
			}

			function bouw() {
				wortel.replaceChildren();
				const omslag = el('div', 'omslag');
				omslag.append(bouwKop(), bouwLijst(), bouwSlot(), bouwVoet());
				wortel.append(omslag);
			}

			function bouwKop() {
				const kop = el('header', 'kop');
				kop.append(el('p', 'merkregel', 'hh-shops.nl'));
				kop.append(el('h1', null, 'Livegang HH Shops'));

				const inleiding = el('p', 'inleiding');
				inleiding.innerHTML =
					'Alles wat er nog moet gebeuren voordat het domein van WordPress naar de nieuwe webshop kan. ' +
					'In volgorde: <strong>Fase 1 eerst</strong>, want daar zit wachttijd bij een ander. ' +
					'Vink af wat klaar is; dat onthoudt deze browser voor je.';
				kop.append(inleiding);

				const af = ALLE.filter((taak) => staat.af[taak.id]).length;
				const deel = ALLE.length ? (af / ALLE.length) * 100 : 0;

				const voortgang = el('div', 'voortgang');
				const kopregel = el('div', 'voortgang-kop');
				kopregel.append(el('p', 'voortgang-label', 'Voortgang'));
				const getal = el('p', 'voortgang-getal');
				getal.append(document.createTextNode(String(af) + ' '));
				getal.append(el('span', null, 'van ' + ALLE.length + ' afgevinkt'));
				kopregel.append(getal);
				voortgang.append(kopregel);

				const balk = el('div', 'balk');
				const vulling = el('div');
				vulling.style.width = deel + '%';
				balk.append(vulling);
				voortgang.append(balk);

				if (meldtekst) voortgang.append(el('p', 'melding', meldtekst));
				kop.append(voortgang);
				return kop;
			}

			function bouwLijst() {
				const fragment = document.createDocumentFragment();
				FASEN.forEach((fase, i) => {
					const sectie = el('section', 'fase');
					const kop = el('div', 'fase-kop');
					kop.append(el('span', 'fase-nr', 'Fase ' + (i + 1)));
					const tekst = el('div', 'fase-tekst');
					tekst.append(el('h2', null, fase.titel));
					tekst.append(el('p', null, fase.tekst));
					kop.append(tekst);
					sectie.append(kop);
					for (const taak of fase.taken) sectie.append(bouwTaak(taak));
					fragment.append(sectie);
				});
				const main = el('main');
				main.append(fragment);
				return main;
			}

			function bouwTaak(taak) {
				const rij = el('div', 'taak');
				rij.dataset.id = taak.id;
				if (staat.af[taak.id]) rij.classList.add('af');

				const vink = document.createElement('input');
				vink.type = 'checkbox';
				vink.className = 'vink';
				vink.id = 'taak-' + taak.id;
				vink.checked = Boolean(staat.af[taak.id]);
				vink.disabled = !magSchrijven;
				vink.addEventListener('change', () => zetAf(taak.id, vink.checked, rij));

				const regel = el('div', 'taak-regel');
				const titel = document.createElement('label');
				titel.className = 'taak-titel';
				titel.htmlFor = vink.id;
				titel.textContent = taak.titel;
				regel.append(titel);

				const wie = el('span', 'wie', WIE_TEKST[taak.wie] || taak.wie);
				wie.dataset.wie = taak.wie;
				regel.append(wie);

				if (taak.blokkeert) regel.append(el('span', 'blokkeert', taak.blokkeert));

				const hoe = el('div', 'taak-hoe');
				if (taak.stappen) {
					const ol = document.createElement('ol');
					for (const stap of taak.stappen) {
						const li = document.createElement('li');
						li.innerHTML = stap;
						ol.append(li);
					}
					hoe.append(ol);
				}
				if (taak.code) {
					const pre = document.createElement('pre');
					pre.append(el('code', null, taak.code));
					hoe.append(pre);
				}
				if (taak.na) {
					const na = el('p', 'taak-na');
					na.innerHTML = taak.na;
					hoe.append(na);
				}

				rij.append(vink, regel, hoe);

				if (taak.waarom) {
					const waarom = el('p', 'waarom');
					waarom.innerHTML = taak.waarom;
					rij.append(waarom);
				}
				return rij;
			}

			function bouwSlot() {
				const slot = el('section', 'slot');
				slot.append(el('h2', null, 'Dit hoeft niet voor de livegang'));
				const ul = document.createElement('ul');
				for (const regel of NIET_NODIG) {
					const li = document.createElement('li');
					li.innerHTML = regel;
					ul.append(li);
				}
				slot.append(ul);
				return slot;
			}

			function bouwVoet() {
				const voet = el('footer', 'voet');
				voet.append(el('span', null, 'Stand van 14 september 2026'));
				voet.append(el('span', null, 'Uitgebreide toelichting: docs/domeinomzetting.md'));
				return voet;
			}

			function zetAf(id, af) {
				if (af) staat.af[id] = new Date().toISOString();
				else delete staat.af[id];
				bouw();
				// De lijst wordt opnieuw opgebouwd, dus het vinkje dat je net aanraakte
				// is een ander element. Zonder dit springt de toetsenbordfocus naar het
				// begin van de pagina en ben je je plek kwijt.
				const terug = document.getElementById('taak-' + id);
				if (terug) terug.focus({ preventScroll: true });
				plan();
			}

			/* ---- bewaren ---- */

			/*
			 * De vinkjes blijven in deze browser staan, in localStorage. Geen account
			 * en geen server nodig: dit bestand werkt door een dubbelklik.
			 *
			 * Dat betekent wel dat de vinkjes van jou alleen zijn. Werkt je collega mee,
			 * stuur hem dan dit bestand en houd zelf bij wat er af is, of zet de stand
			 * over in docs/domeinomzetting.md.
			 */
			const SLEUTEL = 'hh-shops-livegang';

			function bewaar() {
				try {
					localStorage.setItem(SLEUTEL, JSON.stringify(staat));
					if (meldtekst) {
						meldtekst = '';
						bouw();
					}
				} catch (fout) {
					// Privémodus, of de opslag zit vol. De lijst blijft werken, alleen
					// onthoudt hij de vinkjes niet meer.
					meldtekst =
						'Deze browser kan de vinkjes niet bewaren. De lijst werkt wel, maar je begint bij het verversen opnieuw.';
					bouw();
				}
			}

			function plan() {
				bewaar();
			}

			try {
				const bewaard = localStorage.getItem(SLEUTEL);
				if (bewaard) {
					const gelezen = JSON.parse(bewaard);
					if (gelezen && typeof gelezen === 'object' && gelezen.af) staat = gelezen;
				}
			} catch (fout) {
				/* Niets bewaard, of onleesbaar. Dan begin je met een lege lijst. */
			}

			bouw();
		})();
		</script>
